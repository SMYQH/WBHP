name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.4.4)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Run Automated Tests
        run: npm run test

      - name: Build (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser }}
          CRX_KEY: ${{ matrix.browser == 'chrome' && secrets.CRX_KEY || secrets.CRX_KEY_FIREFOX }}
          BUILD_VERSION: ${{ inputs.tag_name || github.ref_name }}
        run: ${{ matrix.browser == 'firefox' && 'npm run build:firefox' || 'npm run build' }}

      - name: Verify artifacts
        run: |
          DIST_DIR="dist-${{ matrix.browser }}"
          test -f $DIST_DIR/wbhp-${{ matrix.browser }}.crx || (echo "❌ CRX missing" && exit 1)
          test -f $DIST_DIR/icons/icon-128.png || (echo "❌ PNG icons missing" && exit 1)
          echo "✅ $DIST_DIR contents:" && ls -la $DIST_DIR/ $DIST_DIR/icons/

      - name: Package artifacts
        run: |
          DIST_DIR="dist-${{ matrix.browser }}"
          cp $DIST_DIR/wbhp-${{ matrix.browser }}.crx wbhp-${{ matrix.browser }}.crx
          cd $DIST_DIR
          zip -r ../wbhp-${{ matrix.browser }}.zip .
          cd ..

      - name: Upload CRX + ZIP
        uses: actions/upload-artifact@v6
        with:
          name: wbhp-${{ matrix.browser }}
          path: |
            wbhp-${{ matrix.browser }}.crx
            wbhp-${{ matrix.browser }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: wbhp-*
          merge-multiple: true
          path: release_assets

      - name: List release assets
        run: ls -la release_assets/

      - name: Sync browser update manifests to release version
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          cat > updates-chrome.xml <<EOF
          <?xml version='1.0' encoding='UTF-8'?>
          <gupdate xmlns='http://www.google.com/update2/response' protocol='2.0'>
            <app appid="apjmikgceehobplahpekiibgkjnfpbdb">
              <updatecheck codebase="https://github.com/SMYQH/wbhp/releases/latest/download/wbhp-chrome.crx" version="${VERSION}" />
            </app>
          </gupdate>
          EOF
          sed -i 's/^[[:space:]]*//' updates-chrome.xml

          cat > updates-firefox.json <<EOF
          {
            "addons": {
              "wbhp@example.com": {
                "updates": [
                  {
                    "version": "${VERSION}",
                    "update_link": "https://github.com/SMYQH/wbhp/releases/latest/download/wbhp-firefox.zip"
                  }
                ]
              }
            }
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates-chrome.xml updates-firefox.json
          if git diff --cached --quiet; then
            echo "Update manifests already current"
          else
            git commit -m "chore: bump update manifests to ${TAG}"
            DEFAULT_BRANCH="$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')"
            git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "WBHP ${{ inputs.tag_name || github.ref_name }}"
          body: |
            ## 🚀 WBHP ${{ inputs.tag_name || github.ref_name }}

            ### 📦 安装

            **Chrome / Edge（推荐使用 ZIP 内的 CRX，支持自动更新）:**
            1. 下载 `wbhp-chrome.zip` 并解压，解压后目录中包含 `wbhp-chrome.crx` 安装包及解压扩展源码
            2. 拖拽解压出的 `wbhp-chrome.crx` 到 `chrome://extensions` 页面（需开启开发者模式）
            3. 或在 `chrome://extensions` 点击「加载已解压的扩展程序」选择解压目录
            4. 通过 CRX 安装后，浏览器会按 `update_url` 自动检查并安装后续更新

            **Firefox:**
            1. 下载 `wbhp-firefox.zip` 并解压
            2. 打开 `about:debugging` → 「临时载入附加组件」
            3. 选择解压后文件夹中的 `manifest.json`
            4. 正式分发可用 `about:addons` 从文件安装 zip（依赖 `update_url` 自动更新）

            ### 🔑 验证
            - CRX3 签名格式，兼容 Chrome 64+ / Firefox 109+
            - 使用固定密钥签名，扩展 ID 保持一致，支持浏览器原生自动更新
          files: |
            release_assets/wbhp-chrome.crx
            release_assets/wbhp-chrome.zip
            release_assets/wbhp-firefox.crx
            release_assets/wbhp-firefox.zip
          draft: false
          prerelease: ${{ contains(inputs.tag_name || github.ref_name, '-') }}
          generate_release_notes: true

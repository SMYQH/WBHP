name: CD

# Triggered only by real tag pushes (e.g. `git push origin v0.1.0`).
# workflow_dispatch is intentionally omitted: it sets `github.ref_name` to
# the default branch, which previously created a bogus "WBHP master" release.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser }}
          CRX_KEY: ${{ matrix.browser == 'chrome' && secrets.CRX_KEY || secrets.CRX_KEY_FIREFOX }}
          BUILD_VERSION: ${{ github.ref_name }}
        run: npx vite build

      - name: Verify artifacts
        run: |
          test -f dist/wbhp-${{ matrix.browser }}.crx || (echo "❌ CRX missing" && exit 1)
          test -f dist/icons/icon-128.png || (echo "❌ PNG icons missing" && exit 1)
          echo "✅ dist contents:" && ls -la dist/ dist/icons/

      - name: Package ZIP
        run: |
          cd dist
          zip -r ../wbhp-${{ matrix.browser }}.zip . -x "*.crx"
          cd ..

      - name: Upload CRX + ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wbhp-${{ matrix.browser }}
          path: |
            dist/wbhp-${{ matrix.browser }}.crx
            wbhp-${{ matrix.browser }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wbhp-*
          merge-multiple: true
          path: artifacts

      - name: List assets
        run: ls -la artifacts/

      - name: Flatten artifacts (CRX is under dist/ after upload)
        run: |
          mkdir -p flattened
          cp artifacts/wbhp-chrome.zip flattened/
          cp artifacts/wbhp-firefox.zip flattened/
          cp artifacts/dist/wbhp-chrome.crx flattened/
          cp artifacts/dist/wbhp-firefox.crx flattened/
          ls -la flattened/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "WBHP ${{ github.ref_name }}"
          body: |
            ## 🚀 WBHP ${{ github.ref_name }}

            ### 📦 安装

            **Chrome / Edge:**
            1. 下载 `wbhp-chrome.zip` 并解压
            2. 打开 `chrome://extensions`，启用「开发者模式」
            3. 点击「加载已解压的扩展程序」，选择解压后的文件夹
            4. 或直接拖拽 `wbhp-chrome.crx` 到扩展页面

            **Firefox:**
            1. 下载 `wbhp-firefox.zip` 并解压
            2. 打开 `about:debugging` → 「临时载入附加组件」
            3. 选择解压后文件夹中的 `manifest.json`

            ### 🔑 验证
            - CRX3 签名格式，兼容 Chrome 64+ / Firefox 109+
            - 使用固定密钥签名，扩展 ID 保持一致
          files: |
            flattened/wbhp-chrome.crx
            flattened/wbhp-chrome.zip
            flattened/wbhp-firefox.crx
            flattened/wbhp-firefox.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Build (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser }}
          CRX_KEY: ${{ matrix.browser == 'chrome' && secrets.CRX_KEY || secrets.CRX_KEY_FIREFOX }}
        run: ${{ matrix.browser == 'firefox' && 'npm run build:firefox' || 'npm run build' }}

      - name: Verify artifacts
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/ dist/icons/
          echo ""
          if [ -f dist/wbhp-${{ matrix.browser }}.crx ]; then
            echo "✅ CRX file created ($(stat -c%s dist/wbhp-${{ matrix.browser }}.crx) bytes)"
          else
            echo "❌ CRX file missing!"
            exit 1
          fi
          if [ -f dist/manifest.json ]; then
            echo "✅ manifest.json present"
          else
            echo "❌ manifest.json missing!"
            exit 1
          fi
          for size in 16 32 48 128; do
            if [ ! -f "dist/icons/icon-${size}.png" ]; then
              echo "❌ icons/icon-${size}.png missing!"
              exit 1
            fi
          done
          echo "✅ All 4 PNG icon sizes present"

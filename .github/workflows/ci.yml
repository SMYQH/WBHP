name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Run Automated Tests
        run: npm run test

      - name: Build (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser }}
          CRX_KEY: ${{ matrix.browser == 'chrome' && secrets.CRX_KEY || secrets.CRX_KEY_FIREFOX }}
        run: ${{ matrix.browser == 'firefox' && 'npm run build:firefox' || 'npm run build' }}

      - name: Verify artifacts
        run: |
          DIST_DIR="dist-${{ matrix.browser }}"
          echo "=== $DIST_DIR/ contents ==="
          ls -la $DIST_DIR/ $DIST_DIR/icons/
          echo ""
          if [ -f $DIST_DIR/wbhp-${{ matrix.browser }}.crx ]; then
            echo "✅ CRX file created ($(stat -c%s $DIST_DIR/wbhp-${{ matrix.browser }}.crx) bytes)"
          else
            echo "❌ CRX file missing!"
            exit 1
          fi
          if [ -f $DIST_DIR/manifest.json ]; then
            echo "✅ manifest.json present"
          else
            echo "❌ manifest.json missing!"
            exit 1
          fi
          for size in 16 32 48 128; do
            if [ ! -f "$DIST_DIR/icons/icon-${size}.png" ]; then
              echo "❌ icons/icon-${size}.png missing!"
              exit 1
            fi
          done
          echo "✅ All 4 PNG icon sizes present"
